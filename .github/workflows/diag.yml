name: Diagnóstico (registro de errores cifrado)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          mkdir -p out
          lftp -c "
            set sftp:auto-confirm yes;
            open --env-password -u \"$SFTP_USER\" sftp://$SFTP_HOST;
            cls -1 -l logs/ > out/logs-list.txt;
            get -O out AI_Form/tareas/data/php-errors.log;
          " || true
          ls -la out
          tar czf out.tgz out
          # Solo se publica cifrado: únicamente quien tiene la clave privada puede leerlo.
          openssl cms -encrypt -binary -aes256 -in out.tgz -outform PEM .github/diag/diag.crt
